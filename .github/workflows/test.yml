name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check (manifest / JS)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node --check lib.js
          node --check background.js
          node --check content.js
      - name: Run unit tests with coverage
        run: npm run test:coverage | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Test coverage'
            echo ''
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^# \{0,1\}//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
